name: Duranta image

# Builds the fork's Dockerfile and pushes it to the private ECR repos in the
# be-dev and be-prod AWS accounts (infra: env/app-common/logto-ecr.tf).
#
# Tags: <git sha> and 1.44.0-duranta.<run number + 1> (Docker Hub already has
# 1.44.0-duranta.1). Bump BASE_VERSION when the fork rebases onto a new upstream
# Logto release.
on:
  push:
    branches: [duranta/org-custom-id]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  BASE_VERSION: 1.44.0

jobs:
  push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: be-dev
            role: arn:aws:iam::992382655363:role/be-dev-logto-github-actions
            region: us-west-2
          - name: be-prod
            role: arn:aws:iam::961341521686:role/be-prod-logto-github-actions
            region: us-east-2
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ matrix.role }}
          aws-region: ${{ matrix.region }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Version tag
        run: echo "VERSION=${BASE_VERSION}-duranta.$((GITHUB_RUN_NUMBER + 1))" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      # The ECS task definition is X86_64, which is also the runner arch.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/getduranta/logto:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/getduranta/logto:${{ env.VERSION }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
